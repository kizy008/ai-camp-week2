name: Daily Collection

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run collection pipeline
        id: pipeline
        run: python pipeline/pipeline.py --sources github,rss --limit 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate articles
        run: |
          ARTICLES=$(ls knowledge/articles/*.json 2>/dev/null || true)
          if [ -n "$ARTICLES" ]; then
            python hooks/validate_json.py $ARTICLES
            python hooks/check_quality.py $ARTICLES
          else
            echo "No article JSON files to validate."
          fi

      - name: Commit and push if changes
        run: |
          if git status --porcelain | grep -q .; then
            ARTICLE_COUNT=$(git status --porcelain knowledge/articles/ | wc -l)
            TODAY=$(date -u +%Y-%m-%d)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "daily collect: ${ARTICLE_COUNT} articles on ${TODAY}"
            git push
          else
            echo "No new data, skipping commit."
          fi
